name: Release

# Add dist/MeowSolver-vX.apk + dist/release-notes-vX.md and push to main
# → creates tag vX and a GitHub Release with the APK attached (skips versions already released).
on:
  push:
    branches: [main]
    paths: ["dist/release-notes-*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in dist/release-notes-*.md; do
            tag="${notes#dist/release-notes-}"; tag="${tag%.md}"
            apk="dist/MeowSolver-$tag.apk"
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; continue; fi
            [ -f "$apk" ] || { echo "::error::$apk missing"; exit 1; }
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Meow Solver $tag" --notes-file "$notes" --latest
          done
